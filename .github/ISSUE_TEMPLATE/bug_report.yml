name: Bug report
description: Something in ZapretiOS does not work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. If a site still does not open but ZapretiOS itself works, try **Find a Strategy** first, or ask in [Discussions](https://github.com/gorlev/ZapretiOS/discussions).
        **Security problems:** please report them privately instead (see SECURITY.md).

  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
      placeholder: |
        1. Turned the bypass on
        2. Opened example.com in Safari
        3. Expected the page to load; got "connection reset" instead
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: ZapretiOS version or commit
      description: Settings → About, or `git log -1 --format=%h`.
      placeholder: "1.0.0 (abc1234)"
    validations:
      required: true

  - type: input
    id: ios
    attributes:
      label: iOS version
      placeholder: "iOS 26.1"
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device
      placeholder: "iPhone 15 Pro"
    validations:
      required: true

  - type: dropdown
    id: network
    attributes:
      label: Network
      options:
        - Wi-Fi
        - Cellular
        - Both
        - Not related to the network
    validations:
      required: true

  - type: input
    id: strategy
    attributes:
      label: Strategy
      description: The built-in strategy's name, or your own strategy's tpws options.
      placeholder: "TLS Record + Split"

  - type: textarea
    id: log
    attributes:
      label: Log
      description: |
        Open the Log page, reproduce the problem, and paste the relevant lines from the tpws and Tunnel tabs. "Copy Command" gives the exact tpws command too.
        Remove anything you don't want to share, such as sites you visited.
      render: text

  - type: textarea
    id: more
    attributes:
      label: Anything else?
      description: Screenshots, other VPNs or profiles on the device, or how often it happens.
